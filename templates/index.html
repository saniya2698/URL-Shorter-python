<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Shortener</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>URL Shortener</h1>

        <p class="subtitle">
            Convert your long URL into a short URL
        </p>

        <form method="POST">

            <input
                type="url"
                name="url"
                placeholder="Enter your long URL"
                required
            >

            <button type="submit">
                Shorten URL
            </button>

        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

    </div>

</body>

</html>
